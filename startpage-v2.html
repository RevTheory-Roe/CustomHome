<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #000000;
            background-image: url('wallpaper.png'); /* Place your wallpaper.png in the same folder */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        /* Header with Clock and Weather */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding: 20px;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid rgba(125, 123, 168, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .clock {
            font-size: 48px;
            font-weight: 300;
            color: #ffffff;
        }

        .date {
            font-size: 18px;
            color: #aaaaaa;
            margin-top: 5px;
        }

        .weather {
            text-align: right;
        }

        .weather-temp {
            font-size: 36px;
            color: #7d7ba8;
            font-weight: 300;
        }

        .weather-desc {
            font-size: 16px;
            color: #aaaaaa;
            margin-top: 5px;
        }

        .weather-location {
            font-size: 14px;
            color: #666666;
            margin-top: 3px;
        }

        /* Search Bar */
        .search-container {
            margin-bottom: 50px;
        }

        .search-box {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        #search-input {
            width: 100%;
            padding: 18px 24px;
            font-size: 18px;
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(125, 123, 168, 0.3);
            border-radius: 50px;
            color: #ffffff;
            outline: none;
            transition: all 0.3s ease;
        }

        #search-input:focus {
            border-color: #7d7ba8;
            box-shadow: 0 0 20px rgba(125, 123, 168, 0.3);
        }

        #search-input::placeholder {
            color: #555555;
        }

        /* Links Grid */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .category {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid rgba(125, 123, 168, 0.3);
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        .category:hover {
            border-color: #7d7ba8;
            box-shadow: 0 0 20px rgba(125, 123, 168, 0.2);
            transform: translateY(-2px);
        }

        .category-title {
            font-size: 20px;
            font-weight: 600;
            color: #7d7ba8;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #7d7ba8;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(5px);
            border-radius: 8px;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .link-item:hover {
            background: rgba(125, 123, 168, 0.2);
            border-color: #7d7ba8;
            transform: translateX(5px);
        }

        .link-icon {
            width: 24px;
            height: 24px;
            margin-right: 12px;
            font-size: 20px;
        }

        .link-name {
            font-size: 16px;
            font-weight: 500;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
                gap: 20px;
            }

            .weather {
                text-align: center;
            }

            .clock {
                font-size: 36px;
            }

            .links-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Loading state */
        .loading {
            color: #7d7ba8;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="time-section">
                <div class="clock" id="clock">--:--</div>
                <div class="date" id="date">Loading...</div>
            </div>
            <div class="weather">
                <div class="weather-temp" id="weather-temp">
                    <span class="loading">Loading...</span>
                </div>
                <div class="weather-desc" id="weather-desc"></div>
                <div class="weather-location">Workington, UK</div>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="search-container">
            <div class="search-box">
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="Search Google or enter URL..."
                    autocomplete="off"
                />
            </div>
        </div>

        <!-- Links Grid -->
        <div class="links-grid">
            <!-- Gaming -->
            <div class="category">
                <div class="category-title">🎮 Gaming</div>
                <div class="links">
                    <a href="https://store.steampowered.com/" class="link-item">
                        <span class="link-icon">🎮</span>
                        <span class="link-name">Steam</span>
                    </a>
                    <a href="https://www.epicgames.com/store" class="link-item">
                        <span class="link-icon">🎯</span>
                        <span class="link-name">Epic Games</span>
                    </a>
                    <a href="https://www.gog.com/" class="link-item">
                        <span class="link-icon">🕹️</span>
                        <span class="link-name">GOG</span>
                    </a>
                </div>
            </div>

            <!-- Media -->
            <div class="category">
                <div class="category-title">📺 Media</div>
                <div class="links">
                    <a href="https://www.youtube.com/" class="link-item">
                        <span class="link-icon">▶️</span>
                        <span class="link-name">YouTube</span>
                    </a>
                    <a href="https://www.twitch.tv/" class="link-item">
                        <span class="link-icon">🎥</span>
                        <span class="link-name">Twitch</span>
                    </a>
                    <a href="https://www.netflix.com/" class="link-item">
                        <span class="link-icon">🎬</span>
                        <span class="link-name">Netflix</span>
                    </a>
                </div>
            </div>

            <!-- AI -->
            <div class="category">
                <div class="category-title">🤖 AI</div>
                <div class="links">
                    <a href="https://chatgpt.com/" class="link-item">
                        <span class="link-icon">💬</span>
                        <span class="link-name">ChatGPT</span>
                    </a>
                    <a href="https://claude.ai/" class="link-item">
                        <span class="link-icon">✨</span>
                        <span class="link-name">Claude</span>
                    </a>
                    <a href="https://gemini.google.com/" class="link-item">
                        <span class="link-icon">🔮</span>
                        <span class="link-name">Gemini</span>
                    </a>
                </div>
            </div>

            <!-- Tech -->
            <div class="category">
                <div class="category-title">💻 Tech</div>
                <div class="links">
                    <a href="https://github.com/" class="link-item">
                        <span class="link-icon">⚙️</span>
                        <span class="link-name">GitHub</span>
                    </a>
                    <a href="https://www.techradar.com/" class="link-item">
                        <span class="link-icon">📰</span>
                        <span class="link-name">TechRadar</span>
                    </a>
                    <a href="https://uk.webuy.com/" class="link-item">
                        <span class="link-icon">🛒</span>
                        <span class="link-name">CEX</span>
                    </a>
                </div>
            </div>

            <!-- Mobile Phones -->
            <div class="category">
                <div class="category-title">📱 Mobile Phones</div>
                <div class="links">
                    <a href="https://www.gsmarena.com/" class="link-item">
                        <span class="link-icon">📱</span>
                        <span class="link-name">GSMArena</span>
                    </a>
                    <a href="https://www.xda-developers.com/" class="link-item">
                        <span class="link-icon">🔧</span>
                        <span class="link-name">XDA Developers</span>
                    </a>
                    <a href="https://www.androidauthority.com/" class="link-item">
                        <span class="link-icon">🤖</span>
                        <span class="link-name">Android Authority</span>
                    </a>
                </div>
            </div>

            <!-- Shopping -->
            <div class="category">
                <div class="category-title">🛍️ Shopping</div>
                <div class="links">
                    <a href="https://www.amazon.co.uk/" class="link-item">
                        <span class="link-icon">📦</span>
                        <span class="link-name">Amazon</span>
                    </a>
                    <a href="https://www.ebay.co.uk/" class="link-item">
                        <span class="link-icon">🏷️</span>
                        <span class="link-name">eBay</span>
                    </a>
                    <a href="https://www.aliexpress.com/" class="link-item">
                        <span class="link-icon">🌐</span>
                        <span class="link-name">AliExpress</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Clock and Date
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;
            
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('en-GB', options);
        }
        
        updateClock();
        setInterval(updateClock, 1000);

        // Weather (using Open-Meteo API - free, no API key needed)
        async function updateWeather() {
            try {
                // Workington coordinates
                const lat = 54.6423;
                const lon = -3.5539;
                
                const response = await fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&temperature_unit=celsius`
                );
                const data = await response.json();
                
                if (data.current_weather) {
                    const temp = Math.round(data.current_weather.temperature);
                    const weatherCode = data.current_weather.weathercode;
                    
                    document.getElementById('weather-temp').textContent = `${temp}°C`;
                    document.getElementById('weather-desc').textContent = getWeatherDescription(weatherCode);
                }
            } catch (error) {
                console.error('Weather fetch error:', error);
                document.getElementById('weather-temp').innerHTML = '<span class="loading">--°C</span>';
                document.getElementById('weather-desc').textContent = 'Unable to load';
            }
        }

        function getWeatherDescription(code) {
            const weatherCodes = {
                0: 'Clear sky',
                1: 'Mainly clear',
                2: 'Partly cloudy',
                3: 'Overcast',
                45: 'Foggy',
                48: 'Foggy',
                51: 'Light drizzle',
                53: 'Drizzle',
                55: 'Heavy drizzle',
                61: 'Light rain',
                63: 'Rain',
                65: 'Heavy rain',
                71: 'Light snow',
                73: 'Snow',
                75: 'Heavy snow',
                77: 'Snow grains',
                80: 'Light showers',
                81: 'Showers',
                82: 'Heavy showers',
                85: 'Light snow showers',
                86: 'Snow showers',
                95: 'Thunderstorm',
                96: 'Thunderstorm with hail',
                99: 'Thunderstorm with hail'
            };
            return weatherCodes[code] || 'Unknown';
        }

        updateWeather();
        // Update weather every 10 minutes
        setInterval(updateWeather, 600000);

        // Search functionality
        const searchInput = document.getElementById('search-input');
        
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const query = searchInput.value.trim();
                if (query) {
                    // Check if it's a URL
                    if (query.includes('.') && !query.includes(' ')) {
                        // Add https:// if not present
                        const url = query.startsWith('http') ? query : 'https://' + query;
                        window.location.href = url;
                    } else {
                        // Search on Google
                        window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
                    }
                }
            }
        });

        // Focus search on 's' key
        document.addEventListener('keydown', (e) => {
            if (e.key === 's' && document.activeElement !== searchInput) {
                e.preventDefault();
                searchInput.focus();
            }
        });
    </script>
</body>
</html>
