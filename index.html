<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Tab</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#171923;
  --glass:rgba(30,30,46,.34);
  --glass-strong:rgba(30,30,46,.52);
  --border:rgba(255,255,255,.08);
  --text:#cdd6f4;
  --muted:#8f939e;
  --accent:#89b4fa;
  --hover:rgba(137,180,250,.11);
}
html,body{width:100%;min-height:100%;margin:0}
body{
  font-family:"Segoe UI",Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 20% 15%,rgba(137,180,250,.10),transparent 28rem),
    radial-gradient(circle at 82% 78%,rgba(180,142,255,.09),transparent 30rem),
    linear-gradient(145deg,#171923 0%,#1b1d29 52%,#151720 100%);
  display:grid;
  place-items:center;
  padding:32px;
}
.shell{width:min(920px,92vw);display:flex;flex-direction:column;align-items:center;gap:26px}
.clock{text-align:center;user-select:none}
.time{font-size:clamp(54px,6vw,76px);font-weight:300;letter-spacing:-3px;line-height:1}
.date{margin-top:8px;font-size:15px;color:var(--muted)}
.search{width:min(640px,100%);position:relative}
.search input{
  width:100%;
  border:1px solid var(--border);
  background:var(--glass);
  backdrop-filter:blur(18px) saturate(130%);
  -webkit-backdrop-filter:blur(18px) saturate(130%);
  color:var(--text);
  padding:15px 48px 15px 18px;
  border-radius:14px;
  outline:none;
  font-size:16px;
  box-shadow:0 16px 50px rgba(0,0,0,.28);
  transition:.18s ease;
}
.search input:focus{border-color:rgba(137,180,250,.45);background:var(--glass-strong)}
.search input::placeholder{color:#73798d}
.search .icon{position:absolute;right:17px;top:50%;translate:0 -50%;color:var(--muted);font-size:17px;pointer-events:none}
.shortcuts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:100%}
.shortcut{
  min-height:112px;
  text-decoration:none;
  color:var(--text);
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--glass);
  backdrop-filter:blur(18px) saturate(130%);
  -webkit-backdrop-filter:blur(18px) saturate(130%);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:11px;
  box-shadow:0 8px 28px rgba(0,0,0,.16);
  transition:.16s ease;
}
.shortcut:hover{transform:translateY(-3px);background:var(--hover);border-color:rgba(137,180,250,.32)}
.shortcut img{width:44px;height:44px;object-fit:contain;border-radius:10px}
.shortcut span{font-size:13px;font-weight:600;white-space:nowrap}
@media(max-width:800px){.shortcuts{grid-template-columns:repeat(3,1fr)}}
@media(max-width:480px){body{padding:20px}.shortcuts{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main class="shell">
  <section class="clock">
    <div class="time" id="time">--:--</div>
    <div class="date" id="date">Loading...</div>
  </section>

  <form class="search" id="searchForm">
    <input id="searchInput" type="text" autocomplete="off" placeholder="Search Google or enter a URL">
    <div class="icon">⌕</div>
  </form>

  <section class="shortcuts">
    <a class="shortcut" href="https://www.youtube.com/">
      <img src="https://cdn.simpleicons.org/youtube/FF0000" alt=""><span>YouTube</span>
    </a>
    <a class="shortcut" href="https://xivmodarchive.com/">
      <img src="https://www.google.com/s2/favicons?domain=xivmodarchive.com&sz=128" alt=""><span>XMA</span>
    </a>
    <a class="shortcut" href="https://heliosphere.app/">
      <img src="https://www.google.com/s2/favicons?domain=heliosphere.app&sz=128" alt=""><span>Heliosphere</span>
    </a>
    <a class="shortcut" href="https://chatgpt.com/">
      <img src="https://cdn.simpleicons.org/openai/FFFFFF" alt=""><span>ChatGPT</span>
    </a>
    <a class="shortcut" href="https://store.steampowered.com/">
      <img src="https://cdn.simpleicons.org/steam/FFFFFF" alt=""><span>Steam</span>
    </a>
    <a class="shortcut" href="https://store.epicgames.com/">
      <img src="https://cdn.simpleicons.org/epicgames/FFFFFF" alt=""><span>Epic</span>
    </a>
    <a class="shortcut" href="https://www.netflix.com/">
      <img src="https://cdn.simpleicons.org/netflix/E50914" alt=""><span>Netflix</span>
    </a>
    <a class="shortcut" href="https://formdata.uk/">
      <img src="https://www.google.com/s2/favicons?domain=formdata.uk&sz=128" alt=""><span>Work · Rota & CMS</span>
    </a>
  </section>
</main>

<script>
const timeEl=document.getElementById("time");
const dateEl=document.getElementById("date");
const searchForm=document.getElementById("searchForm");
const searchInput=document.getElementById("searchInput");

function updateClock(){
  const now=new Date();
  timeEl.textContent=now.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",hour12:false});
  dateEl.textContent=now.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
}
updateClock();
setInterval(updateClock,1000);

searchForm.addEventListener("submit",e=>{
  e.preventDefault();
  const value=searchInput.value.trim();
  if(!value)return;
  const looksLikeUrl=/^https?:\/\//i.test(value)||(/^[^\s]+\.[^\s]+$/.test(value)&&!value.includes(" "));
  window.location.href=looksLikeUrl
    ? (/^https?:\/\//i.test(value)?value:"https://"+value)
    : "https://www.google.com/search?q="+encodeURIComponent(value);
});

document.addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement!==searchInput){
    e.preventDefault();
    searchInput.focus();
  }
});
</script>
</body>
</html>
